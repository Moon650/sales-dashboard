<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>Sales Performance Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one wide control bar, a KPI strip, a full-width monthly trend, then paired region/channel and product/scatter rows, ending in a sortable ledger table. Charts cross-filter each other. */
:root {
  --bg: #F2F5F8;
  --surface: #FFFFFF;
  --surface-2: #F6F8FA;
  --fg: #13212D;
  --muted: #566878;
  --line: #DCE3EA;
  --accent: #0B7A85;
  --accent-ink: #FFFFFF;
  --accent-soft: #D9F0F2;
  --rev: #8FA8BC;
  --profit: #0B7A85;
  --margin: #C9820A;
  --good: #1B7F47;
  --crit: #B83A2E;
  --c1: #0B7A85;
  --c2: #C9820A;
  --c3: #5656C8;
  --c4: #D9532B;
  --c5: #4A9A33;
  --c6: #A23B72;
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1620; --surface: #142230; --surface-2: #182A3A; --fg: #E6EDF3; --muted: #8FA1B2; --line: #243748;
    --accent: #3CC4CF; --accent-ink: #06222A; --accent-soft: #123941;
    --rev: #4E6F8A; --profit: #3CC4CF; --margin: #F2B134; --good: #5CC98B; --crit: #FF8A7A;
    --c1: #3CC4CF; --c2: #F2B134; --c3: #8E8EF5; --c4: #FF8A65; --c5: #7CC96A; --c6: #D878AE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1620; --surface: #142230; --surface-2: #182A3A; --fg: #E6EDF3; --muted: #8FA1B2; --line: #243748;
  --accent: #3CC4CF; --accent-ink: #06222A; --accent-soft: #123941;
  --rev: #4E6F8A; --profit: #3CC4CF; --margin: #F2B134; --good: #5CC98B; --crit: #FF8A7A;
  --c1: #3CC4CF; --c2: #F2B134; --c3: #8E8EF5; --c4: #FF8A65; --c5: #7CC96A; --c6: #D878AE;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.45;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { width: 100%; max-width: 1680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.top h1 { font-family: var(--font-display); font-size: 28px; line-height: 1.1; margin: 0; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.top .src { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 500; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.link { border: 0; background: none; color: var(--accent); padding: 8px 4px; }
.top .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.err { color: var(--crit); font-size: 13px; margin: 0; }

/* filters */
.bar { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .field > span { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 28px 7px 10px; min-width: 150px; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface-2); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 12px; cursor: pointer; }
.chip b { font-weight: 600; }
.chip i { font-style: normal; width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--surface); font-size: 11px; }
.hint { color: var(--muted); font-size: 12px; }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.kpi { background: var(--surface); padding: 16px 18px; min-width: 0; }
.kpi .l { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.kpi .v { font-family: var(--font-display); font-size: 32px; line-height: 1.15; font-weight: 700; margin: 4px 0 2px; letter-spacing: -0.01em; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi .s.good { color: var(--good); }
.kpi .s.crit { color: var(--crit); }

/* readout */
.read { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px 24px; }
.read div { border-top: 2px solid var(--line); padding-top: 8px; min-width: 0; }
.read .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.read .t { font-size: 13px; margin-top: 2px; text-wrap: pretty; }

/* grid + cards */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.s12 { grid-column: span 12; } .s7 { grid-column: span 7; } .s5 { grid-column: span 5; }
@media (max-width: 960px) { .s7, .s5 { grid-column: span 12; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 14px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.card header { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; align-items: baseline; }
.card h2 { font-family: var(--font-display); font-size: 17px; margin: 0; font-weight: 600; letter-spacing: -0.005em; }
.card header p { margin: 0; color: var(--muted); font-size: 12px; }
.chartbox { position: relative; width: 100%; min-width: 0; }
.chartbox canvas { max-width: 100%; }
.toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.toggle button { border: 0; background: none; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* channel */
.chan { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
.chan .donut { flex: 0 0 190px; max-width: 100%; }
.chan ul { list-style: none; margin: 0; padding: 0; flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.chan li button { width: 100%; text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; display: grid; grid-template-columns: 10px 1fr auto; gap: 2px 10px; align-items: center; }
.chan li button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chan .sw { width: 10px; height: 10px; border-radius: 3px; grid-row: span 2; }
.chan .nm { font-weight: 600; }
.chan .sub { color: var(--muted); font-size: 12px; grid-column: 2 / span 2; }

/* table */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 920px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 0; }
th button { background: none; border: 0; padding: 8px 10px; cursor: pointer; text-transform: inherit; letter-spacing: inherit; font: inherit; color: inherit; width: 100%; text-align: inherit; }
th.r, td.r { text-align: right; }
th.r button { text-align: right; }
th[aria-sort="ascending"] button, th[aria-sort="descending"] button { color: var(--fg); }
tbody tr:hover { background: var(--surface-2); }
tfoot td { font-weight: 600; border-bottom: 0; background: var(--surface-2); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
.pill.low { color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, transparent); border-color: color-mix(in srgb, var(--crit) 35%, transparent); }
.pill.high { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); border-color: color-mix(in srgb, var(--good) 35%, transparent); }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 40px 16px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty h2 { font-family: var(--font-display); margin: 0; font-size: 18px; }
.empty p { margin: 0; color: var(--muted); }
.foot { color: var(--muted); font-size: 12px; }
@media (max-width: 520px) { .top h1 { font-size: 24px; } .kpi .v { font-size: 28px; } select { min-width: 0; width: 100%; } .field { flex: 1 1 140px; } .chips { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div id="root"><p style="padding:24px;color:var(--muted)">Loading dashboard…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function () {
  var h = React.createElement;
  var useState = React.useState, useMemo = React.useMemo, useEffect = React.useEffect, useRef = React.useRef;

  /* ---------- Data: rows of sales_data.xlsx (Date, Region, Product, Sales Channel, Unit Price, Revenue, Cost; Profit = Revenue - Cost) ---------- */
  var SAMPLE = [
    ['2026-01-05','North America','Wireless Mouse','Online',25,3750,2250],
    ['2026-01-12','Europe','Mechanical Keyboard','Retail Store',89,8010,5340],
    ['2026-01-19','Asia Pacific','USB-C Hub','Online',39,5850,3510],
    ['2026-01-26','Latin America','27" Monitor','Distributor',229,13740,10300],
    ['2026-02-02','North America','Laptop Stand','Online',45,4500,2700],
    ['2026-02-09','Europe','Noise-Cancelling Headphones','Retail Store',179,10740,7160],
    ['2026-02-16','Asia Pacific','Webcam 1080p','Online',59,5310,3540],
    ['2026-02-23','Middle East','Bluetooth Speaker','Distributor',69,6210,4140],
    ['2026-03-02','North America','External SSD 1TB','Online',119,11900,8330],
    ['2026-03-09','Europe','Smartwatch','Retail Store',249,14940,10460],
    ['2026-03-16','Asia Pacific','Wireless Earbuds','Online',99,9900,6240],
    ['2026-03-23','Africa','Portable Power Bank','Distributor',35,4200,2520],
    ['2026-03-30','North America','Gaming Chair','Retail Store',299,14950,10470],
    ['2026-04-06','Latin America','LED Desk Lamp','Online',32,3840,2110],
    ['2026-04-13','Europe','Tablet 10"','Online',329,19740,14800],
    ['2026-04-20','Asia Pacific','Wi-Fi 6 Router','Retail Store',129,10320,7230],
    ['2026-04-27','Middle East','Smart Home Camera','Online',79,7110,4740],
    ['2026-05-04','North America','Fitness Tracker','Distributor',69,8280,5380],
    ['2026-05-11','Europe','Ergonomic Office Chair','Retail Store',349,17450,12220],
    ['2026-05-18','Asia Pacific','Standing Desk','Online',499,24950,18710],
    ['2026-05-25','Africa','Solar Charger','Distributor',55,4950,3220],
    ['2026-06-01','North America','Portable Projector','Online',219,13140,9190],
    ['2026-06-08','Latin America','E-Reader','Retail Store',139,9730,6490],
    ['2026-06-15','Europe','Action Camera','Online',189,11340,7940]
  ].map(function (r) { return { date: r[0], region: r[1], product: r[2], channel: r[3], price: r[4], revenue: r[5], cost: r[6], profit: r[5] - r[6] }; });

  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  /* Live data: rows are read from the Supabase "sales" table. The key below is the public (publishable) key.
     The table allows read-only access, so the key cannot change any data. */
  var SUPABASE_URL = 'https://wvkxwmqnitxflolmezjl.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_JTwgvDmuKDcK0AEfyBwYGA_z9gGH8_c';
  function loadLive() {
    var url = SUPABASE_URL + '/rest/v1/sales?select=sale_date,region,product,category,sales_channel,unit_price,revenue,cost,profit&order=sale_date.asc&limit=10000';
    return fetch(url, { headers: { apikey: SUPABASE_KEY } })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function (data) {
        var out = data.map(function (r) {
          return { date: r.sale_date, region: r.region, product: r.product, category: r.category, channel: r.sales_channel, price: +r.unit_price, revenue: +r.revenue, cost: +r.cost, profit: +r.profit };
        });
        if (!out.length) throw new Error('the sales table is empty');
        return out;
      });
  }

  /* Product groupings used by the Category filter. The Excel file has no category column, so these are assigned here. */
  var CATS = {
    'Wireless Mouse': 'Computers & Accessories', 'Mechanical Keyboard': 'Computers & Accessories', 'USB-C Hub': 'Computers & Accessories',
    'Laptop Stand': 'Computers & Accessories', 'Webcam 1080p': 'Computers & Accessories', 'External SSD 1TB': 'Computers & Accessories',
    '27" Monitor': 'Computers & Accessories', 'Tablet 10"': 'Computers & Accessories', 'Wi-Fi 6 Router': 'Computers & Accessories',
    'Noise-Cancelling Headphones': 'Audio', 'Bluetooth Speaker': 'Audio', 'Wireless Earbuds': 'Audio',
    'Smartwatch': 'Wearables', 'Fitness Tracker': 'Wearables',
    'Portable Power Bank': 'Power', 'Solar Charger': 'Power',
    'Gaming Chair': 'Furniture & Lighting', 'Ergonomic Office Chair': 'Furniture & Lighting', 'Standing Desk': 'Furniture & Lighting', 'LED Desk Lamp': 'Furniture & Lighting',
    'Smart Home Camera': 'Cameras & Media', 'Portable Projector': 'Cameras & Media', 'E-Reader': 'Cameras & Media', 'Action Camera': 'Cameras & Media'
  };

  /* ---------- Processing ---------- */
  function prep(rows) {
    return rows.map(function (r, i) {
      return Object.assign({}, r, { id: i, month: r.date.slice(0, 7), category: r.category || CATS[r.product] || 'Other', margin: r.revenue ? r.profit / r.revenue : 0 });
    });
  }
  function agg(rows, keyFn) {
    var m = new Map();
    rows.forEach(function (r) {
      var k = keyFn(r), a = m.get(k);
      if (!a) { a = { key: k, revenue: 0, cost: 0, profit: 0, n: 0, price: 0 }; m.set(k, a); }
      a.revenue += r.revenue; a.cost += r.cost; a.profit += r.profit; a.n += 1; a.price += r.price;
    });
    return Array.from(m.values()).map(function (a) { a.margin = a.revenue ? a.profit / a.revenue : 0; return a; });
  }
  function total(rows) {
    var t = { revenue: 0, cost: 0, profit: 0, n: rows.length, price: 0 };
    rows.forEach(function (r) { t.revenue += r.revenue; t.cost += r.cost; t.profit += r.profit; t.price += r.price; });
    t.margin = t.revenue ? t.profit / t.revenue : 0;
    t.avgPrice = rows.length ? t.price / rows.length : 0;
    return t;
  }
  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : null;
    if (v == null || v === '') return null;
    var n = parseFloat(String(v).replace(/[$,\s]/g, ''));
    return isFinite(n) ? n : null;
  }
  function isoDate(v) {
    if (v instanceof Date) {
      if (isNaN(v)) return null;
      var d = new Date(v.getTime() + 43200000);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    if (typeof v === 'string') {
      var m = v.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return m[1] + '-' + m[2] + '-' + m[3];
      var p = new Date(v);
      return isNaN(p) ? null : isoDate(p);
    }
    return null;
  }
  function parseRows(json) {
    var out = [];
    json.forEach(function (row) {
      var o = {};
      Object.keys(row).forEach(function (k) { o[k.toLowerCase().replace(/[^a-z]/g, '')] = row[k]; });
      var date = isoDate(o.date), region = o.region, product = o.product;
      var channel = o.saleschannel || o.channel;
      var revenue = num(o.revenue), cost = num(o.cost), profit = num(o.profit), price = num(o.unitprice);
      if (!date || !region || !product || revenue == null) return;
      if (cost == null && profit != null) cost = revenue - profit;
      if (cost == null) return;
      if (profit == null) profit = revenue - cost;
      out.push({ date: date, region: String(region), product: String(product), channel: String(channel || 'Unspecified'), price: price == null ? 0 : price, revenue: revenue, cost: cost, profit: profit });
    });
    return out;
  }

  /* ---------- Formatting ---------- */
  var usd = function (n) { return '$' + Math.round(n).toLocaleString('en-US'); };
  var usd2 = function (n) { return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var kfmt = function (n) { var a = Math.abs(n); return a >= 1000 ? '$' + (n / 1000).toFixed(a >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'K' : '$' + Math.round(n); };
  var pct = function (x, d) { return (x * 100).toFixed(d == null ? 1 : d) + '%'; };
  var mlabel = function (m, multi) { var p = m.split('-'); return MON[+p[1] - 1] + (multi ? " '" + p[0].slice(2) : ''); };
  var mfull = function (m) { var p = m.split('-'); return MON[+p[1] - 1] + ' ' + p[0]; };
  var fdate = function (iso) { var p = iso.split('-'); return +p[2] + ' ' + MON[+p[1] - 1] + ' ' + p[0]; };
  var short = function (s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; };

  /* ---------- Theme ---------- */
  function useTheme() {
    var st = useState(0), set = st[1];
    useEffect(function () {
      var bump = function () { set(function (x) { return x + 1; }); };
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      if (mq.addEventListener) mq.addEventListener('change', bump);
      var mo = new MutationObserver(bump);
      mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      return function () { if (mq.removeEventListener) mq.removeEventListener('change', bump); mo.disconnect(); };
    }, []);
  }
  function tokens() {
    var cs = getComputedStyle(document.documentElement);
    var g = function (n) { return cs.getPropertyValue(n).trim(); };
    return { fg: g('--fg'), muted: g('--muted'), line: g('--line'), surface: g('--surface'), rev: g('--rev'), profit: g('--profit'), margin: g('--margin'), good: g('--good'), crit: g('--crit'),
      cat: [1, 2, 3, 4, 5, 6].map(function (i) { return g('--c' + i); }) };
  }
  var fade = function (c, a) { return c.length === 7 ? c + a : c; };
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  Chart.defaults.font.family = "'IBM Plex Sans', system-ui, sans-serif";
  Chart.defaults.font.size = 12;

  function base(t) {
    return {
      responsive: true, maintainAspectRatio: false,
      animation: reduce ? false : { duration: 300 },
      plugins: {
        legend: { position: 'top', align: 'end', labels: { color: t.muted, usePointStyle: true, boxWidth: 8, boxHeight: 8, padding: 14 } },
        tooltip: { backgroundColor: t.surface, titleColor: t.fg, bodyColor: t.muted, borderColor: t.line, borderWidth: 1, padding: 10, cornerRadius: 6, boxPadding: 4 }
      }
    };
  }
  var grid = function (t) { return { color: t.line, drawTicks: false }; };
  var noBorder = { display: false };

  function ChartBox(props) {
    var ref = useRef(null), cref = useRef(null);
    useEffect(function () {
      if (!cref.current) {
        cref.current = new Chart(ref.current, { type: props.type, data: props.data, options: props.options });
      } else {
        cref.current.data = props.data;
        cref.current.options = props.options;
        cref.current.update();

          chips.length ? chips.map(function (c) { return h('button', { key: c[0], type: 'button', className: 'chip', 'aria-label': 'Remove ' + c[1] + ' filter ' + c[2], onClick: function () { toggle(c[0], f[c[0]]); } }, c[1] + ': ', h('b', null, c[2]), h('i', { 'aria-hidden': 'true' }, '×')); }) : h('span', { className: 'hint' }, 'Click a bar, slice or row in any chart to filter the dashboard.'),
          chips.length ? h('button', { type: 'button', className: 'btn link', onClick: clear }, 'Clear all') : null)),

          h('div', { className: 'kpis' },

            h(Kpi, { label: 'Profit', value: usd(tot.profit), sub: active ? pct(tot.profit / ov.profit) + ' of all profit' : 'after ' + usd(tot.cost) + ' cost' }),
            h(Kpi, { label: 'Profit margin', value: pct(tot.margin), tone: active ? (marginDelta >= 0 ? 'good' : 'crit') : '', sub: active ? (marginDelta >= 0 ? '▲ ' : '▼ ') + Math.abs(marginDelta).toFixed(1) + ' pts vs ' + pct(ov.margin) + ' overall' : 'profit ÷ revenue' }),
            h(Kpi, { label: 'Average unit price', value: usd2(tot.avgPrice), sub: 'mean across ' + tot.n + ' lines' })),

          h('div', { className: 'read' }, readout(filtered).map(function (x) { return h('div', { key: x.k }, h('div', { className: 'k' }, x.k), h('div', { className: 't' }, x.v)); })),

            h('section', { className: 'card s12' },
              h('header', null, h('h2', null, 'Monthly revenue, profit and margin'), h('p', null, 'Bars use the left axis, the line uses the right. Click a month to filter.')),
              h(Trend, { t: t, months: dims.months, rows: pass('month'), sel: f.month, onPick: function (m) { toggle('month', m); } })),
            h('section', { className: 'card s7' },
              h('header', null, h('h2', null, 'Regions'), h('p', null, 'Revenue and profit, with margin under each name')),
              h(Regions, { t: t, rows: pass('region'), sel: f.region, onPick: function (r) { toggle('region', r); } })),
            h('section', { className: 'card s5' },

              h(Channels, { t: t, rows: pass('channel'), all: dims.channels, sel: f.channel, onPick: function (c) { toggle('channel', c); } })),
            h('section', { className: 'card s5' },
              h('header', null, h('h2', null, 'Top products'),
                h('div', { className: 'toggle', role: 'group', 'aria-label': 'Rank by' },
                  h('button', { type: 'button', 'aria-pressed': metric === 'profit', onClick: function () { setMetric('profit'); } }, 'Profit'),

            h('section', { className: 'card s7' },

            h('section', { className: 'card s12' },
              h('header', null, h('h2', null, 'Sales ledger'), h('p', null, 'Click a column heading to sort. Margin below 28% is flagged red, 36% and above green.')),
              h(Ledger, { rows: filtered, sort: sort, onSort: sortBy })))),
      h('p', { className: 'foot' }, 'Profit is revenue minus cost. Rows are read from the Supabase sales table each time the page loads. Loading another file reads its first sheet in your browser only and expects the same column names as the sample.'));
  }
